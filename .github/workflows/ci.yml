# Runs on every push to main or dev and on every pull request.
# See "Automatic checks (CI)" in the README.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # Reports problems without failing the run, until the first clean lint. Then delete the next line.
        continue-on-error: true
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install the test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Keep the report (screenshots and traces of failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Builds and starts the real production setup (Caddy + backend in Docker) and talks to it,
  # so mistakes in the Docker files are caught before you deploy. Only for main and pull requests into main.
  docker:
    name: Production stack (Docker)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-secret-key-not-for-real-use-0123456789abcdef
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password-1
      SITE_ADDRESS: ":80"
      SEED_DEMO_DATA: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait until the site answers
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "The stack did not become healthy in time"
          docker compose logs
          exit 1
      - name: Check the website and the API through the proxy
        run: |
          set -e
          curl -fsS http://localhost/ | grep -q 'id="root"'
          curl -fsS http://localhost/students | grep -q 'id="root"'          # reloads and deep links work
          curl -fsSI http://localhost/ | grep -qi '^content-security-policy'   # security headers are set
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/students)
          test "$status" = "401"                                               # student data needs a sign-in
          token=$(curl -fsS -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password-1"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          curl -fsS http://localhost/api/analytics -H "Authorization: Bearer $token" \
            | python3 -c 'import sys, json; d = json.load(sys.stdin); assert d["total_students"] > 0, d'
          if curl -fsS --max-time 3 http://localhost:8000/api/health; then
            echo "The backend must not be reachable directly"; exit 1
          fi
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
